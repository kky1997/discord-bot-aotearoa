name: Monthly Climb Countdown

on:
  schedule:
    - cron: '0 9 28 * *'
      timezone: 'Australia/Adelaide'

  workflow_dispatch:

jobs:
  send-countdown:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Send countdown
        run: npm start
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}